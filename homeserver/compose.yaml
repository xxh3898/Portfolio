name: portfolio

services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:?PORTFOLIO_IMAGE must be set}
    container_name: portfolio
    restart: unless-stopped
    read_only: true
    init: true
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge
