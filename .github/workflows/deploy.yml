name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xxh3898/portfolio

jobs:
  validate:
    name: Validate image
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    name: Publish ARM64 image
    if: github.ref == 'refs/heads/main'
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=portfolio-arm64
          cache-to: type=gha,mode=max,scope=portfolio-arm64

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            printf '## Published image\n\n'
            printf -- "- Image: \`%s:%s\`\n" "${IMAGE_NAME}" "${GITHUB_SHA}"
            printf -- "- Digest: \`%s\`\n" "${IMAGE_DIGEST}"
          } >>"${GITHUB_STEP_SUMMARY}"
